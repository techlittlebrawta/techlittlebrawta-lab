---
name: Ansible CI

"on":
  pull_request:
    paths:
      - "ansible.cfg"
      - ".ansible-lint"
      - ".yamllint.yml"
      - "collections/**"
      - "inventories/**"
      - "playbooks/**"
      - "requirements.txt"
      - "execution-environment.yml"
      - ".github/workflows/ansible-ci.yml"
  push:
    branches:
      - main
    paths:
      - "ansible.cfg"
      - ".ansible-lint"
      - ".yamllint.yml"
      - "collections/**"
      - "inventories/**"
      - "playbooks/**"
      - "requirements.txt"
      - "execution-environment.yml"
      - ".github/workflows/ansible-ci.yml"

permissions:
  contents: read

concurrency:
  group: ansible-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ansible-ci:
    name: ansible-ci
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install validation tooling and runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "ansible-core>=2.17" ansible-lint yamllint
          python -m pip install -r requirements.txt

      - name: Install Ansible collections
        run: ansible-galaxy collection install -r collections/requirements.yml

      - name: Lint YAML
        run: >-
          yamllint
          .ansible-lint
          .yamllint.yml
          collections
          inventories
          playbooks
          execution-environment.yml
          .github/workflows/ansible-ci.yml

      - name: Lint Ansible content
        run: ansible-lint playbooks

      - name: Syntax check preflight
        run: ansible-playbook -i inventories/lab/inventory.example.yml --syntax-check playbooks/preflight.yml

      - name: Syntax check Linux facts
        run: ansible-playbook -i inventories/lab/inventory.example.yml --syntax-check playbooks/linux_facts.yml

      - name: Syntax check Junos facts
        run: ansible-playbook -i inventories/lab/inventory.example.yml --syntax-check playbooks/junos_facts.yml
