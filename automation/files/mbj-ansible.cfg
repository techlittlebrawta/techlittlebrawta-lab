[defaults]
inventory = /opt/automation/repos/techlittlebrawta-lab/automation/inventories/pnetlab/hosts.yml
collections_path = /opt/automation/collections:/usr/share/ansible/collections
roles_path = /opt/automation/repos/techlittlebrawta-lab/automation/roles
host_key_checking = True
retry_files_enabled = False
interpreter_python = auto_silent
forks = 20
timeout = 30
log_path = /opt/automation/logs/ansible.log
stdout_callback = ansible.builtin.default

[persistent_connection]
connect_timeout = 30
command_timeout = 90

[ssh_connection]
pipelining = True
retries = 2
