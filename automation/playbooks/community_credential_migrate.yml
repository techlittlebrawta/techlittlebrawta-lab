---
- name: Migrate the existing encrypted appliance credential inside AAP
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    controller_host: "{{ lookup('env', 'CONTROLLER_HOST') }}"
    controller_token: "{{ lookup('env', 'CONTROLLER_OAUTH_TOKEN') }}"
    source_username: >-
      {{ lookup('env', 'ANSIBLE_NET_USERNAME') |
         default(ansible_user | default('admin'), true) }}
    source_password: >-
      {{ lookup('env', 'ANSIBLE_NET_PASSWORD') |
         default(ansible_password | default(''), true) }}
  tasks:
    - name: Require the source downstream credential
      ansible.builtin.assert:
        that:
          - source_password | length > 0
      no_log: true

    - name: Require the controller endpoint credential
      ansible.builtin.assert:
        that:
          - controller_host | length > 0
      no_log: true

    - name: Require the controller API credential
      ansible.builtin.assert:
        that:
          - controller_token | length > 0
      no_log: true

    - name: Resolve the destination credential
      ansible.builtin.uri:
        url: "{{ controller_host }}/api/controller/v2/credentials/?name={{ 'TLB | Community Downstream Secret' | urlencode }}"
        headers:
          Authorization: "Bearer {{ controller_token }}"
        validate_certs: true
        return_content: true
      register: destination
      no_log: true

    - name: Require exactly one destination
      ansible.builtin.assert:
        that: destination.json.count | int == 1
      no_log: true

    - name: Transfer the encrypted value without displaying or storing it in Git
      ansible.builtin.uri:
        url: "{{ controller_host }}{{ destination.json.results[0].url }}"
        method: PATCH
        headers:
          Authorization: "Bearer {{ controller_token }}"
        validate_certs: true
        body_format: json
        body:
          inputs:
            tlb_lab_username: "{{ source_username }}"
            tlb_lab_password: "{{ source_password }}"
        status_code: 200
      no_log: true
