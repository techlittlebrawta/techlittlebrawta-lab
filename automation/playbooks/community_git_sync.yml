---
- name: Safely fast-forward the MBJ automation repository
  hosts: mbj_community_control
  gather_facts: false
  tasks:
    - ansible.builtin.command:
        argv: [/usr/bin/sudo, /usr/local/sbin/mbj-control-maintenance, sync]
      register: sync_result
      changed_when: "'Already up to date.' not in sync_result.stdout"
