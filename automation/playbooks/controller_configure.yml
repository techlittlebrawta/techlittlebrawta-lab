---
- name: Reconcile scoped Tech Little Brawta objects in Automation Controller
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../controller/aap-managed.yml
  vars:
    aap_hostname: "{{ lookup('env', 'CONTROLLER_HOST') }}"
    aap_token: "{{ lookup('env', 'CONTROLLER_OAUTH_TOKEN') }}"

  pre_tasks:
    - name: Require scoped controller authentication and live deployment data
      ansible.builtin.assert:
        that:
          - aap_hostname | length > 0
          - aap_token | length > 0
          - tlb_aap_ip is defined and tlb_aap_ip | length > 0
          - tlb_pnetlab_ip is defined and tlb_pnetlab_ip | length > 0
          - tlb_esxi_ip is defined and tlb_esxi_ip | length > 0
          - tlb_juniper_ip is defined and tlb_juniper_ip | length > 0
          - tlb_ee_image is defined and tlb_ee_image | length > 0
          - tlb_management_network_cidr is defined and tlb_management_network_cidr | length > 0
        fail_msg: Supply controller auth through an AAP credential and live endpoints/EE image at launch.
      no_log: true

  tasks:
    - name: Reconcile resource-scoped controller configuration with bearer authentication
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/../tools/aap_reconcile.py"
        stdin: >-
          {{ {
            'inventories': controller_inventories,
            'hosts': controller_hosts,
            'groups': controller_groups,
            'credential_types': controller_credential_types,
            'credentials': controller_credentials,
            'execution_environments': controller_execution_environments,
            'projects': controller_projects,
            'templates': controller_templates,
            'workflows': controller_workflows,
            'schedules': controller_schedules
          } | to_json }}
      environment:
        CONTROLLER_HOST: "{{ aap_hostname }}"
        CONTROLLER_OAUTH_TOKEN: "{{ aap_token }}"
        AAP_VALIDATE_CERTS: "{{ lookup('env', 'AAP_VALIDATE_CERTS') | default('true', true) }}"
      register: controller_reconcile
      changed_when: (controller_reconcile.stdout | from_json).changed
      no_log: true

    - name: Report reconciled controller object count
      ansible.builtin.debug:
        msg: >-
          AAP reconciliation completed with
          {{ ((controller_reconcile.stdout | from_json).actions | length) }} controlled changes.
