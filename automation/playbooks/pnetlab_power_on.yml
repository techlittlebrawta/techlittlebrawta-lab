---
- name: Ensure every Tech Little Brawta appliance is powered on
  hosts: LAB-PNETLAB-01
  gather_facts: false
  tasks:
    - name: Start every appliance through the fixed root-owned lifecycle helper
      ansible.builtin.command:
        argv:
          - /usr/bin/sudo
          - -n
          - /usr/local/sbin/tlb-pnetlab-power-on-all
      changed_when: false
