---
- name: Reconcile Tech Little Brawta objects in Automation Controller
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../aap/controller.yml
  vars:
    controller_hostname: "{{ lookup('env', 'CONTROLLER_HOST') }}"
    controller_oauthtoken: "{{ lookup('env', 'CONTROLLER_OAUTH_TOKEN') }}"
    controller_validate_certs: true
    controller_configuration_secure_logging: true

  pre_tasks:
    - name: Require controller authentication, endpoint data, and a published EE image
      ansible.builtin.assert:
        that:
          - controller_hostname | length > 0
          - controller_oauthtoken | length > 0
          - tlb_aap_ip is defined and tlb_aap_ip | length > 0
          - tlb_pnetlab_ip is defined and tlb_pnetlab_ip | length > 0
          - tlb_esxi_ip is defined and tlb_esxi_ip | length > 0
          - tlb_juniper_ip is defined and tlb_juniper_ip | length > 0
          - tlb_ee_image is defined and tlb_ee_image | length > 0
        fail_msg: Supply controller auth through an AAP credential and live endpoints/EE image at launch.
      no_log: true

  tasks:
    - name: Reconcile organizations
      ansible.builtin.include_role:
        name: infra.controller_configuration.organizations

    - name: Reconcile teams
      ansible.builtin.include_role:
        name: infra.controller_configuration.teams

    - name: Reconcile inventories
      ansible.builtin.include_role:
        name: infra.controller_configuration.inventories

    - name: Reconcile hosts
      ansible.builtin.include_role:
        name: infra.controller_configuration.hosts

    - name: Reconcile groups
      ansible.builtin.include_role:
        name: infra.controller_configuration.groups

    - name: Reconcile credential objects without secret values
      ansible.builtin.include_role:
        name: infra.controller_configuration.credentials

    - name: Reconcile execution environments
      ansible.builtin.include_role:
        name: infra.controller_configuration.execution_environments

    - name: Reconcile projects and synchronize source
      ansible.builtin.include_role:
        name: infra.controller_configuration.projects

    - name: Reconcile job templates
      ansible.builtin.include_role:
        name: infra.controller_configuration.job_templates

    - name: Reconcile workflow job templates
      ansible.builtin.include_role:
        name: infra.controller_configuration.workflow_job_templates

    - name: Reconcile AAP 2.7 gateway team role assignments
      ansible.platform.role_team_assignment:
        aap_hostname: "{{ controller_hostname }}"
        aap_token: "{{ controller_oauthtoken }}"
        aap_validate_certs: "{{ controller_validate_certs }}"
        team: "{{ item.team }}"
        role_definition: "{{ item.role_definition }}"
        assignment_objects:
          - name: "{{ tlb_organization_name }}"
            type: organizations
        state: present
      loop: "{{ gateway_role_team_assignments }}"
      loop_control:
        label: "{{ item.team }} -> {{ item.role_definition }}"
      no_log: "{{ controller_configuration_secure_logging }}"
