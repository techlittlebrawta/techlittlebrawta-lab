# Managed by AAP from techlittlebrawta-lab. Local edits are overwritten.
server time.cloudflare.com iburst
server time.google.com iburst
server time.facebook.com iburst

driftfile /var/lib/chrony/chrony.drift
makestep 1.0 3
rtcsync

# AAP and lab appliances may synchronize without exposing NTP elsewhere.
allow 192.168.1.0/24
allow 10.255.255.0/24
bindaddress 10.255.255.1

keyfile /etc/chrony/chrony.keys
leapsectz right/UTC
logdir /var/log/chrony
